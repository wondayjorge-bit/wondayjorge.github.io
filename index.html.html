  <script>
    const WINE_CATALOG = [
      {
        id: 'reserva-tinto-2023',
        exactName: 'RESERVA TINTO 2023',
        style: 'tinto',
        mouthfeel: 'velvety',
        aroma: 'red_fruit_floral',
        foodKey: 'redMeatCheeseMed',
        desc: {
          pt: 'Este Reserva apresenta cor granada intensa, e perfil aromático frutado, sobressaindo a fruta vermelha madura, envolta em notas delicadas florais. Em prova demonstra taninos macios, equilibrados com uma acidez atraente, revelando um final longo e elegante. Combinação perfeita com grande variedade de queijos, carnes e cozinha mediterrânea.',
          en: 'This Reserva displays an intense garnet colour and a fruity aromatic profile with ripe red fruit standing out, wrapped in delicate floral notes. On the palate it shows soft tannins balanced with attractive acidity, revealing a long and elegant finish. Perfect pairing with a wide variety of cheeses, meats, and Mediterranean cuisine.',
          zh: '这款珍藏红葡萄酒呈深石榴红色，果香浓郁，以成熟红果为主，并交织细腻花香。口感单宁柔顺，酸度宜人，余味悠长优雅，非常适合搭配各类奶酪、肉类和地中海菜肴。',
          ja: '深いガーネット色で、熟した赤い果実を中心に繊細な花の香りが寄り添う果実味豊かなアロマが特徴です。口当たりは柔らかく、心地よい酸味と調和し、長くエレガントな余韻を残します。チーズや肉料理、地中海料理と好相性です。',
          es: 'Este Reserva presenta un color granate intenso y un perfil aromático afrutado, destacando la fruta roja madura envuelta en delicadas notas florales. En boca muestra taninos suaves, equilibrados con una acidez atractiva y un final largo y elegante. Combinación perfecta con quesos, carnes y cocina mediterránea.',
          fr: 'Cette Réserve présente une robe grenat intense et un profil aromatique fruité dominé par les fruits rouges mûrs et de délicates notes florales. En bouche, les tanins souples et l’acidité harmonieuse mènent à une finale longue et élégante. Idéale avec fromages, viandes et cuisine méditerranéenne.'
        }
      },
      {
        id: 'rose-de-ventozelo',
        exactName: 'ROSE DE VENTOZELO',
        style: 'rose',
        mouthfeel: 'crisp_vibrant',
        aroma: 'red_fruit_floral',
        foodKey: 'lightFishWhiteMeat',
        desc: {
          pt: 'De cor suave, tonalidade rosa-pálido. Demonstra um aroma intenso a frutos vermelhos maduros, sobressaindo as framboesas, acompanhados por discretas notas vegetais. Na boca revela acidez vibrante, elegantemente equilibrada com o volume de boca, tornando-o um rosé muito cativante. Pode ser servido como aperitivo ou a acompanhar pratos leves de peixe e carnes brancas.',
          en: 'Soft pale-pink hue with an intense aroma of ripe red fruits, especially raspberries, alongside discreet herbal notes. Vibrant acidity elegantly balanced with mouth volume makes it a captivating rosé. Ideal as an aperitif or with light fish and white meat dishes.',
          zh: '柔和浅粉色酒泽，散发浓郁成熟的红果香气，尤以覆盆子突出，并伴有含蓄的植物清香。口感酸度活泼，酒体饱满平衡，清新迷人。适合作为开胃酒或搭配清淡鱼类与白肉菜肴。',
          ja: '淡いピンク色で、ラズベリーを中心とした熟した赤い果実の豊かな香りに、穏やかなハーバル感が重なります。生き生きとした酸味と口当たりのボリュームが調和した魅力的なロゼです。食前酒や軽い魚介・白身肉料理に最適です。',
          es: 'De color suave, tonalidad rosa pálido. Aroma intenso a frutos rojos maduros, destacando las frambuesas, con discretas notas vegetales. En boca muestra acidez vibrante equilibrada con el volumen. Ideal como aperitivo o con platos ligeros de pescado y carnes blancas.',
          fr: 'Robe rose pâle délicate au nez intense de fruits rouges mûrs, notamment la framboise, avec de discrètes notes végétales. En bouche, l’acidité vive et le volume s’équilibrent élégamment. Parfait à l’apéritif ou avec des poissons légers et viandes blanches.'
        }
      },
      {
        id: 'essencia-tinto-2016',
        exactName: 'ESSENCIA TINTO 2016',
        style: 'tinto',
        mouthfeel: 'structured_spicy',
        aroma: 'dark_fruit_spice_oak',
        foodKey: 'gameHeartyMeatSpice',
        desc: {
          pt: 'Vinho ainda pouco evoluído na cor, com predomínio de aromas intensos de fruta preta madura e especiarias, destacando-se a pimenta preta. Revela-se vibrante na boca, de taninos redondos e macios, com a fruta e toque especiado a reapareceram, assim como ligeiro tostado. Vinho gastronómico que combina especialmente bem com pratos de carne, caça ou condimentados.',
          en: 'Youthful colour with intense aromas of ripe black fruit and spices, especially black pepper. Vibrant on the palate with round, soft tannins, returning fruit and spice notes, and a subtle toasted touch. Gastronomic wine pairing especially well with meat, game, or spiced dishes.',
          zh: '酒色年轻，以浓郁成熟黑果与香料香气为主，黑胡椒尤为突出。口感充满活力，单宁圆润柔顺，果香与辛香再次浮现并带轻微烘烤感。极具美食搭配力的酒款，尤其适合肉类、野味或重调味菜肴。',
          ja: '色調はまだ若々しく、熟した黒系果実とスパイス（特に黒胡椒）の力強い香りが際立ちます。口中は生き生きとし、丸みのある滑らかなタンニンに果実味やスパイシーさ、ほのかなトースト香が重なります。肉料理やジビエ、スパイスを使った料理に最適です。',
          es: 'Color aún poco evolucionado, con predominio de aromas intensos de fruta negra madura y especias, destacando la pimienta negra. Vibrante en boca, de taninos redondos y suaves, con notas frutales, especiadas y ligero tostado. Ideal con carnes, caza o platos condimentados.',
          fr: 'Robe encore jeune aux arômes intenses de fruits noirs mûrs et d’épices, dominés par le poivre noir. Bouche vibrante aux tanins ronds et souples, rappelant les fruits, les épices et un léger toasté. Idéal avec viandes, gibier ou plats relevés.'
        }
      },
      {
        id: 'malvasia-fina-2023',
        exactName: 'MALVASIA FINA 2023',
        style: 'branco',
        mouthfeel: 'crisp_vibrant',
        aroma: 'citrus_tropical_floral',
        foodKey: 'vegetarianSaladLightFish',
        desc: {
          pt: 'De aparência cristalina e cor ténue, esta monocasta surge com perfil fresco, destacando-se as notas de fruta tropical e citrinos. Em prova, revela-se mais contido e discreto do que no aroma, sobressaindo a frescura e a firmeza. Ideal como aperitivo, a acompanhar pratos leves de peixe ou carnes brancas, e combina com pratos vegetarianos como saladas ou gratinados de legumes.',
          en: 'Crystal-clear appearance and pale hue, this single-varietal shows a fresh profile highlighting tropical fruit and citrus notes. On tasting, freshness and firmness stand out cleanly. Ideal as an aperitif, with light fish or white meats, and pairs with vegetarian dishes like salads or vegetable gratins.',
          zh: '外观清澈、色泽浅淡，这款单一品种白葡萄酒清新爽口，热带水果与柑橘香气突出。入口清新而有支撑力。适合作为开胃酒、搭配清淡鱼类或白肉，也可配沙拉或蔬菜焗烤等素食。',
          ja: '澄んだ淡い色合いで、トロピカルフルーツや柑橘の香りが映えるフレッシュな単一品種白ワインです。味わいは爽やかさと芯のある引き締まった印象。食前酒や軽い魚介・白身肉、サラダや野菜のグラタンなどのベジタリアン料理に合います。',
          es: 'De aspecto cristalino y color tenue, perfil fresco con notas de fruta tropical y cítricos. En boca sobresalen la frescura y la firmeza. Ideal como aperitivo, pescados ligeros o carnes blancas, y combina con platos vegetarianos como ensaladas o gratinados de verduras.',
          fr: 'Robe cristalline pâle au profil frais mêlant fruits tropicaux et agrumes. En bouche, fraîcheur et fermeté s’affirment nettement. Idéal à l’apéritif, avec poissons légers ou viandes blanches, ainsi qu’avec des plats végétariens comme salades ou gratins de légumes.'
        }
      },
      {
        id: 'traditional-blend-2024',
        exactName: 'TRADITIONAL BLEND 2024',
        style: 'tinto',
        mouthfeel: 'structured_spicy',
        aroma: 'dark_fruit_spice_oak',
        foodKey: 'redMeatCheeseMed',
        desc: {
          pt: 'De cor rubi azulada, no nariz sobressaem notas de fruta preta envolvidas por nuances florais. Na boca a fruta mantém-se bem presente, revelando boa estrutura e acidez viva que lhe transmite expressão e elegância. O final é longo e persistente com uma agradável sensação de frescura. Pode ser apreciado a solo ou a acompanhar queijos, carnes e cozinha mediterrânea.',
          en: 'Bluish-ruby colour with black fruit notes wrapped in floral nuances on the nose. On the palate the fruit stays prominent with good structure and lively acidity for expression and elegance, finishing long and fresh. Enjoyable on its own or with cheeses, meats, and Mediterranean cuisine.',
          zh: '呈蓝宝石红色，香气以黑果为主并伴随花香。入口果味饱满，结构良好，酸度明快，兼具表现力与优雅感，余味悠长清新。可单饮或搭配奶酪、肉类与地中海料理。',
          ja: '青みを帯びたルビー色で、黒系果実の香りにフローラルなニュアンスが溶け込みます。口中でも果実味がしっかり続き、骨格と生き生きとした酸がエレガンスをもたらし、爽やかな長い余韻へ続きます。単体でもチーズや肉、地中海料理とも楽しめます。',
          es: 'Color rubí azulado, con notas de fruta negra envueltas en matices florales. En boca la fruta está bien presente con buena estructura, acidez viva y final largo y fresco. Ideal solo o con quesos, carnes y cocina mediterránea.',
          fr: 'Robe rubis aux reflets bleutés, nez de fruits noirs souligné de nuances florales. En bouche, le fruit reste présent avec une belle structure, une acidité vive et une finale longue et fraîche. À déguster seul ou avec fromages, viandes et cuisine méditerranéenne.'
        }
      },
      {
        id: 'tinta-barroca-2020',
        exactName: 'TINTA BARROCA 2020',
        style: 'tinto',
        mouthfeel: 'velvety',
        aroma: 'red_fruit_floral',
        foodKey: 'comfortGrillWhiteMeat',
        desc: {
          pt: 'De cor rubi intensa, o aroma é rico, dominado por notas a fruta vermelha fresca, com ligeiro toque floral, complexado pelos aromas de estágio em garrafa. Em prova sobressai o volume de boca, com taninos evidentes, mas macios, compondo um final de boca com acidez equilibrada. Combina com queijos de intensidade média, carnes brancas grelhadas ou comida de conforto.',
          en: 'Deep ruby colour with a rich aroma led by fresh red fruit, a light floral touch, and bottle-ageing complexity. Shows mouth volume with evident yet soft tannins and a balanced acidic finish. Pairs with medium-intensity cheeses, grilled white meats, comfort food, or simple vegetarian dishes.',
          zh: '深邃宝石红，香气丰郁，以新鲜红果为主，带微弱花香及瓶陈复杂感。口感饱满，单宁明显但柔和，酸度平衡。适合搭配中等浓度的奶酪、烤白肉、家常暖心菜或简朴素食。',
          ja: '濃いルビー色で、新鮮な赤い果実を中心にほのかな花香と瓶熟成の複雑さが重なります。口当たりにボリュームがあり、しっかりしつつも柔らかなタンニンとバランスの良い酸が続きます。中程度のチーズやグリルした白身肉、家庭料理に合います。',
          es: 'Color rubí intenso, aroma rico dominado por fruta roja fresca, ligero toque floral y matices de botella. Destaca su volumen en boca, taninos suaves y acidez equilibrada. Combina con quesos medios, carnes blancas a la brasa o cocina reconfortante.',
          fr: 'Robe rubis intense au nez riche de fruits rouges frais, légère note florale et complexité d’élevage en bouteille. Bouche volumineuse aux tanins présents mais souples et finale équilibrée. Parfait avec fromages doux à moyens, viandes blanches grillées ou cuisine réconfortante.'
        }
      },
      {
        id: 'tinto-cao-2022',

        style: 'tinto',
        mouthfeel: 'velvety',
        aroma: 'red_fruit_floral',
        foodKey: 'comfortGrillWhiteMeat',
        desc: {
          pt: 'Vinho de cor rubi aberta, com aroma fresco a fruta, com notas florais. Na boca ressurge a frescura sentida no nariz, rodeada por taninos sedosos, terminado com grande elegância e equilíbrio. Combina na perfeição com pratos leves de carnes brancas ou grelhadas, comida de conforto ou pratos vegetarianos simples.',
          en: 'Bright ruby wine with fresh fruit aromas and floral notes. The nose’s freshness returns on the palate surrounded by silky tannins, finishing with great elegance and balance. Pairs seamlessly with light or grilled white meats, comfort food, or simple vegetarian dishes.',
          zh: '明亮宝石红色，散发新鲜果香与花香。入口延续鼻尖的清新感，单宁如丝绸般顺滑，收尾优雅均衡。非常适合搭配清淡或烧烤白肉、家常菜及简单素食。',
          ja: '明るいルビー色で、フレッシュな果実香とフローラルなノートが広がります。香り通りの爽やかさが口中でも続き、シルキーなタンニンに包まれて上品でバランスの取れた余韻へ。軽い白身肉やグリル、家庭料理に好相性です。',
          es: 'Color rubí abierto, aroma fresco a fruta con notas florales. En boca vuelve la frescura con taninos sedosos y final elegante y equilibrado. Combina perfectamente con carnes blancas ligeras o a la brasa, comida de confort o platos vegetarianos sencillos.',
          fr: 'Robe rubis clair au nez frais de fruits et de notes florales. En bouche, la fraîcheur se prolonge avec des tanins soyeux et une finale élégante et équilibrée. Idéal avec viandes blanches légères ou grillées, cuisine réconfortante ou plats végétariens simples.'
        }

      {
        id: 'dalva-espumante-bruto-rose-2024',

        style: 'espumante',
        mouthfeel: 'crisp_vibrant',

      let bestWine = WINE_CATALOG[0];
      let bestScore = -1;

      WINE_CATALOG.forEach((wine) => {
        let score = 0;
        if (preferredStyle && wine.style === preferredStyle) score += 3;
        if (preferredMouthfeel && wine.mouthfeel === preferredMouthfeel) score += 3;
        if (preferredAroma && wine.aroma === preferredAroma) score += 2;
        if (preferredFoodKey && wine.foodKey === preferredFoodKey) score += 2;

        if (score > bestScore) {
          bestScore = score;
          bestWine = wine;
        }
      });

      const resolvedFoodKey = preferredFoodKey || bestWine.foodKey;
      const pairing = PAIRINGS[resolvedFoodKey] || PAIRINGS[bestWine.foodKey];

      return {
        wine: bestWine,
        pairing
      };
    }

    function getStyleBadgeLabel(style, lang) {
      const map = {
        tinto: { pt: 'Tinto', en: 'Red', zh: '红葡萄酒', ja: '赤', es: 'Tinto', fr: 'Rouge' },
        branco: { pt: 'Branco', en: 'White', zh: '白葡萄酒', ja: '白', es: 'Blanco', fr: 'Blanc' },
        espumante: { pt: 'Espumante', en: 'Sparkling', zh: '起泡酒', ja: 'スパークリング', es: 'Espumoso', fr: 'Effervescent' },
        doce_fortificado: { pt: 'Especial / Doce', en: 'Special / Sweet', zh: '特色 / 甜型', ja: '特別・甘口', es: 'Especial / Dulce', fr: 'Spécial / Doux' }
      };
      return (map[style] && map[style][lang]) || style;
    }

    function updateHeaderAndTabs() {
      const t = UI_TEXT[state.lang];
      document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : state.lang;
      document.getElementById('heroSubtitle').textContent = t.heroSubtitle;
      document.getElementById('label-tab-carta').textContent = t.tabCarta;
      document.getElementById('label-tab-quiz').textContent = t.tabQuiz;
      document.getElementById('label-tab-historia').textContent = t.tabHistoria;
      document.getElementById('footerCopy').textContent = t.footerCopy;

      const langSelect = document.getElementById('langSelect');
      if (langSelect) {
        langSelect.value = state.lang;
      }

      ['carta', 'quiz', 'historia'].forEach((tabName) => {
        const tabBtn = document.getElementById(`tab-${tabName}`);
        tabBtn.className = `hero-card-btn px-2.5 sm:px-4 py-3 sm:py-3.5 rounded-2xl font-semibold text-xs sm:text-sm md:text-base flex items-center justify-center text-center cursor-pointer ${
          state.activeTab === tabName ? 'hero-card-active' : 'hero-card-inactive'
        }`;
      });
    }

    function renderCartaView() {
      const t = UI_TEXT[state.lang];
      const filters = [
        { key: 'all', label: t.filterAll },
        { key: 'tinto', label: t.filterTinto },
        { key: 'branco', label: t.filterBranco },
        { key: 'espumante', label: t.filterEspumante },
        { key: 'doce_fortificado', label: t.filterDoce }
      ];

      const filteredWines =
        state.cartaFilter === 'all'
          ? WINE_CATALOG
          : WINE_CATALOG.filter((w) => w.style === state.cartaFilter);

      return `
        <section class="view-animate space-y-6">
          <div class="bg-parchment rounded-2xl p-6 border border-olive-700/20 shadow-md flex flex-col md:flex-row md:items-end md:justify-between gap-4">
            <div>
              <span class="text-xs uppercase tracking-widest font-semibold text-wine-700">Quinta de Ventozelo</span>
              <h2 class="font-display text-3xl sm:text-4xl font-bold text-olive-900 mt-1">${t.cartaTitle}</h2>
              <p class="text-depth text-sm text-[#3f4433] mt-1 max-w-2xl">${t.cartaSubtitle}</p>
            </div>
            <div class="text-xs font-semibold px-3.5 py-2 rounded-full bg-mustard-100 text-olive-900 border border-mustard-500/40 self-start md:self-auto">
              ${filteredWines.length} / ${WINE_CATALOG.length}
            </div>
          </div>

          <div class="flex flex-wrap gap-2">
            ${filters
              .map(
                (f) => `
              <button
                data-filter="${f.key}"
                class="carta-filter-btn px-4 py-2 rounded-full text-xs sm:text-sm font-medium transition cursor-pointer ${
                  state.cartaFilter === f.key
                    ? 'bg-wine-800 text-white shadow-sm'
                    : 'bg-parchment text-olive-900 border border-olive-700/25 hover:border-mustard-500'
                }"
              >
                ${f.label}
              </button>
            `
              )
              .join('')}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${filteredWines
              .map(
                (wine) => `
              <article class="bg-parchment rounded-2xl p-5 border border-olive-700/20 hover:border-mustard-500/70 transition shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-olive-100 text-olive-800">
                      ${getStyleBadgeLabel(wine.style, state.lang)}
                    </span>
                    <span class="w-2.5 h-2.5 rounded-full bg-mustard-500"></span>
                  </div>
                  <h3 class="font-display text-2xl font-bold text-wine-900 leading-snug">
                    ${wine.exactName}
                  </h3>
                  <p class="text-depth mt-2.5 text-sm text-[#323628] leading-relaxed">
                    ${wine.desc[state.lang] || wine.desc.pt}
                  </p>
                </div>
              </article>
            `
              )
              .join('')}
          </div>
        </section>
      `;
    }

    function renderQuizView() {
      const t = UI_TEXT[state.lang];

      if (state.quizFinished) {
        const { wine, pairing } = computeRecommendation();
        return `
          <section class="view-animate max-w-3xl mx-auto space-y-6">
            <div class="bg-parchment rounded-3xl p-6 sm:p-8 border-2 border-mustard-500/60 shadow-lg">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-wine-100 text-wine-800">
                  ${t.resultBadge}
                </span>
                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-olive-100 text-olive-800">
                  ${getStyleBadgeLabel(wine.style, state.lang)}
                </span>
              </div>

              <h2 class="font-display text-3xl sm:text-5xl font-bold text-wine-900 mt-2">
                ${wine.exactName}
              </h2>

              <p class="text-depth mt-3 text-sm sm:text-base text-[#313527] leading-relaxed">
                ${wine.desc[state.lang] || wine.desc.pt}
              </p>

              <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="p-4 rounded-2xl bg-olive-100/80 border border-olive-700/20">
                  <p class="text-xs font-bold uppercase tracking-wider text-olive-700">
                    ${t.pairingLabel}
                  </p>
                  <p class="text-depth mt-1.5 text-sm font-semibold text-olive-900">
                    ${pairing.dish[state.lang] || pairing.dish.pt}
                  </p>
                </div>

                <div class="p-4 rounded-2xl bg-mustard-100 border border-mustard-500/40">
                  <p class="text-xs font-bold uppercase tracking-wider text-mustard-600">
                    ${t.whyLabel}
                  </p>
                  <p class="text-depth mt-1.5 text-sm text-[#313527] leading-relaxed">
                    ${pairing.reason[state.lang] || pairing.reason.pt}
                  </p>
                </div>
              </div>

              <div class="mt-7 flex flex-wrap gap-3">
                <button
                  id="btnNewQuizQuestions"
                  class="px-5 py-2.5 rounded-xl bg-olive-700 hover:bg-olive-800 text-white text-sm font-semibold transition cursor-pointer shadow"
                >
                  ${t.newQuestionsBtn}
                </button>
                <button
                  id="btnRestartSameQuiz"
                  class="px-5 py-2.5 rounded-xl bg-mustard-500 hover:bg-mustard-600 text-olive-900 text-sm font-semibold transition cursor-pointer"
                >
                  ${t.restartQuizBtn}
                </button>
                <button
                  id="btnGoToCarta"
                  class="px-5 py-2.5 rounded-xl bg-white hover:bg-wine-100 text-wine-900 border border-wine-800/30 text-sm font-semibold transition cursor-pointer"
                >
                  ${t.viewInCartaBtn}
                </button>
              </div>
            </div>
          </section>
        `;
      }

      const question = state.questions[state.currentQuestionIndex];
      const stepNum = state.currentQuestionIndex + 1;
      const progressPct = (stepNum / 5) * 100;

      return `
        <section class="view-animate max-w-3xl mx-auto space-y-5">
          <div class="bg-parchment rounded-2xl p-6 border border-olive-700/20 shadow-md">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h2 class="font-display text-3xl sm:text-4xl font-bold text-olive-900">
                ${t.quizTitle}
              </h2>
              <button
                id="btnRegenerateMidQuiz"
                class="text-xs font-semibold px-3.5 py-1.5 rounded-full bg-mustard-100 hover:bg-mustard-400/30 text-olive-900 border border-mustard-500/40 transition cursor-pointer"
              >
                ${t.newQuestionsBtn}
              </button>
            </div>
            <p class="text-depth text-sm text-[#3f4433] mt-1.5">${t.quizSubtitle}</p>

            <div class="mt-5">
              <div class="flex items-center justify-between text-xs font-semibold text-olive-800 mb-1.5">
                <span>${t.questionLabel} ${stepNum} ${t.ofLabel} 5</span>
                <span class="px-2.5 py-0.5 rounded-full bg-wine-100 text-wine-800">
                  ${question.category[state.lang] || question.category.pt}
                </span>
              </div>
              <div class="w-full h-2.5 bg-olive-100 rounded-full overflow-hidden">
                <div
                  class="h-full bg-gradient-to-r from-olive-700 to-mustard-500 transition-all duration-300"
                  style="width: ${progressPct}%"
                ></div>
              </div>
            </div>
          </div>

          <div class="bg-parchment rounded-3xl p-6 sm:p-7 border border-olive-700/20 shadow-md">
            <h3 class="font-display text-2xl sm:text-3xl font-bold text-wine-900">
              ${question.prompt[state.lang] || question.prompt.pt}
            </h3>

            <div class="mt-5 space-y-3">
              ${question.options
                .map(
                  (opt, idx) => `
                <button
                  data-option-index="${idx}"
                  class="quiz-option-btn w-full text-left p-4 rounded-2xl border border-olive-700/25 bg-olive-100/55 hover:bg-mustard-100 hover:border-mustard-600 transition flex items-center justify-between gap-3 cursor-pointer group"
                >
                  <span class="text-depth text-sm sm:text-base font-medium text-[#1f2317]">
                    ${opt.label[state.lang] || opt.label.pt}
                  </span>
                  <span class="w-7 h-7 rounded-full bg-white border border-olive-700/25 group-hover:bg-wine-800 group-hover:text-white group-hover:border-wine-800 flex items-center justify-center text-xs font-bold text-olive-800 shrink-0 transition">
                    ${String.fromCharCode(65 + idx)}
                  </span>
                </button>
              `
                )
                .join('')}
            </div>
          </div>
        </section>
      `;
    }

    function renderHistoriaView() {
      const t = UI_TEXT[state.lang];
      return `
        <section class="view-animate max-w-4xl mx-auto space-y-6">
          <div class="bg-parchment rounded-3xl overflow-hidden border border-olive-700/20 shadow-md">
            <div class="h-56 sm:h-72 w-full overflow-hidden relative">
              <img
                src="https://images.unsplash.com/photo-1560493676-04071c5f467b?auto=format&fit=crop&w=1400&q=80"
                alt="Quinta de Ventozelo vineyards in the Douro valley"
                class="w-full h-full object-cover"
                onerror="this.src='https://placehold.co/1200x500/3f4a28/fbf9f4?text=Quinta+de+Ventozelo';"
              />
              <div class="absolute bottom-3 left-3 px-3 py-1 rounded-full text-xs font-semibold bg-olive-900/80 text-mustard-100 backdrop-blur-sm">
                São João da Pesqueira · Douro, Portugal
              </div>
            </div>

            <div class="p-6 sm:p-8 space-y-4">
              <span class="text-xs uppercase tracking-widest font-bold text-mustard-600">
                ${t.tabHistoria}
              </span>
              <h2 class="font-display text-3xl sm:text-4xl font-bold text-olive-900">
                ${t.historiaTitle}
              </h2>
              <p class="text-depth text-sm sm:text-base font-medium text-wine-800">
                ${t.historiaSubtitle}
              </p>

              <div class="text-depth pt-2 space-y-4 text-sm sm:text-base text-[#313527] leading-relaxed">
                <p>${t.historyP1}</p>
                <p>${t.historyP2}</p>
                <p>${t.historyP3}</p>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function render() {
      try {
        updateHeaderAndTabs();
        const container = document.getElementById('appContainer');

        if (state.activeTab === 'carta') {
          container.innerHTML = renderCartaView();
          container.querySelectorAll('.carta-filter-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.cartaFilter = btn.dataset.filter;
              render();
            });
          });
        } else if (state.activeTab === 'quiz') {
          container.innerHTML = renderQuizView();
          container.querySelectorAll('.quiz-option-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              const idx = Number(btn.dataset.optionIndex);
              const currentQ = state.questions[state.currentQuestionIndex];
              state.answers.push(currentQ.options[idx]);

              if (state.currentQuestionIndex < state.questions.length - 1) {
                state.currentQuestionIndex += 1;
              } else {
                state.quizFinished = true;
              }
              render();
            });
          });

          const regenBtn = document.getElementById('btnRegenerateMidQuiz');
          if (regenBtn) {
            regenBtn.addEventListener('click', () => {
              resetQuiz(true);
              render();
            });
          }

          const newQuizBtn = document.getElementById('btnNewQuizQuestions');
          if (newQuizBtn) {
            newQuizBtn.addEventListener('click', () => {
              resetQuiz(true);
              render();
            });
          }

          const restartBtn = document.getElementById('btnRestartSameQuiz');
          if (restartBtn) {
            restartBtn.addEventListener('click', () => {
              resetQuiz(false);
              render();
            });
          }

          const goCartaBtn = document.getElementById('btnGoToCarta');
          if (goCartaBtn) {
            goCartaBtn.addEventListener('click', () => {
              state.activeTab = 'carta';
              render();
            });
          }
        } else if (state.activeTab === 'historia') {
          container.innerHTML = renderHistoriaView();
        }
      } catch (err) {
        console.error('Render error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      resetQuiz(true);

      const langSelect = document.getElementById('langSelect');
      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          state.lang = e.target.value;
          render();
        });
      }

      ['carta', 'quiz', 'historia'].forEach((tab) => {
        document.getElementById(`tab-${tab}`).addEventListener('click', () => {
          state.activeTab = tab;
          if (tab === 'quiz' && state.questions.length === 0) {
            resetQuiz(true);
          }
          render();
        });
      });

      render();
    });
  </script>
</body>
</html>
